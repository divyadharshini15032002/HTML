<body>
    <script>
       function insertAt(arr, index, ...items) {
           return [
            ...arr.slice(0, index),
            ...items,
            ...arr.slice(index)
        ];
       }
       const result = insertAt([1,2,3,4], 2, "X", "Y");
       console.log(result);
       document.write(result);
</script>
