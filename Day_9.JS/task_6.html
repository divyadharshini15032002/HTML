<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let price = 1000;          
        let discount = 20;         

        let discountAmount = (price * discount) / 100;
        let finalPrice = price - discountAmount;
        
        document.write("discountAmount is:"+discountAmount+"<br>")
        document.write("finalPrice is:"+finalPrice+"<br>")

    </script>
    
</body>
</html>
