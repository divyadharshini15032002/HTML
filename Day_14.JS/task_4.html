<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function celsiusToFahrenheit(celsius) {
            return (celsius * 9/5) + 32;
        }
        console.log(celsiusToFahrenheit(12));   
        console.log(celsiusToFahrenheit(7));  
        document.write(""+celsiusToFahrenheit(12)+"<br>")
        document.write(""+celsiusToFahrenheit(7)+"<br>")

    </script>
    
</body>
</html>
