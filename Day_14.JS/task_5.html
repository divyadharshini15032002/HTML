<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function countCharacters(str) {
            return str.length;
        }
        console.log(countCharacters("hello"));     
        console.log(countCharacters("divyadharshini"));
        
        document.write(""+countCharacters("hello")+"<br>");
        document.write(""+countCharacters("divyadharshini")+"<br>")
    </script>
    
</body>
</html>
