<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function reverseString(str) {
            return str.split('').reverse().join('');
        }
        console.log(reverseString("sabith"));  
        console.log(reverseString("divya")); 

        document.write(""+reverseString("sabith")+"<br>");
        document.write(""+reverseString("divya")+"<br>");
    </script>
    
</body>
</html>
