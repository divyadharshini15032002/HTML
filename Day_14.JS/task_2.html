    <script>
        function checkEvenOdd(num){
            if(num % 2 === 0){
                return "Even";
            } else  {
                return "Odd";
            }
        }

                console.log(checkEvenOdd(9));

                document.write(""+checkEvenOdd(9)+"<br>");

            
        

        
    </script>
