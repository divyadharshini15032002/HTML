<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 42;            
        let str = "Hello";       
        let bool = true; 
        let undef;               
        let nul = null;          
        document.write("num is: "+typeof(num)+"<br>"); 
        document.write("str is: "+typeof(str)+"<br>");
        document.write("bool is: "+typeof(bool)+"<br>");     
        document.write("undef is: "+typeof(undef)+"<br>"); 
        document.write("nul is: "+typeof(nul)+"<br>");     
            
        

        
    </script>
</body>
</html>
