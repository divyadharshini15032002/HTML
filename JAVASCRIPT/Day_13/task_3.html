<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        let n=10
        let i=1;
        let sum=0;

        while(i<=n){
            console.log(i);
            sum += i;
            i++;
        }
        console.log("sum=",sum);
        document.write(""+sum+"<br>")
    </script>
    
</body>
