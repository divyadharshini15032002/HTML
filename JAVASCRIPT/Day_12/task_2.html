<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         let A =Number(prompt("Enter value of A:"));
        let B=Number(prompt("Enter value for B:"));
        let C=prompt("Enter value for C(example:AB):");

        switch(C) {
            case "AB":
            console.log("Result(A+B)="+(A+B));
            break;
            default:
                console.log("Invalid C value!");
        }

    </script>
    
</body>
</html>
