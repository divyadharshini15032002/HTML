<body>
    <script>
        function getGreaterNumber(a, b) {
            return a > b ? a : b;
        }
        console.log(getGreaterNumber(3, 23)); 
        console.log(getGreaterNumber(2, 17)); 
        document.write(""+getGreaterNumber(3,23)+"<br>")
        document.write(""+getGreaterNumber(2, 17)+"<br>")



    </script>
    
</body>
