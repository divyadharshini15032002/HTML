<!DOCTYPE html>

<body>
    <script>
        function rectangleArea(width, height) {
            return width * height;
        }
        console.log(rectangleArea(14, 10)); 
        console.log(rectangleArea(5, 7)); 
        
        document.write(""+rectangleArea(14, 10)+"<br>");
        document.write(""+rectangleArea(5, 7)+"<br>");

    </script>
    
</body>
</html>
