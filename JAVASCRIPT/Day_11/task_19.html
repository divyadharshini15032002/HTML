<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       function calculateBill(name, units) {
        let amount = 0;
        if (units <= 200) {
            amount = units * 0.80;
        } else if (units <= 300) {
            amount = (200 * 0.80) + ((units - 200) * 0.90);
        } else {
            amount = (200 * 0.80) + (100 * 0.90) + ((units - 300) * 1.00);
        }
        if (amount > 400) {
            amount += amount * 0.15;
        }
        amount += 100;
        console.log("Electricity Bill");
        console.log("----------------------");
        console.log("Name: " + name);
        console.log("Units Consumed: " + units);
        console.log("Total Charges: Rs " + amount.toFixed(2));
    }
    calculateBill("Divya dharshini",500);

    </script>
    
</body>
</html>
