<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = Number(prompt("Enter value of a:"));
        let b = Number(prompt("Enter value of b:"));
        let c = Number(prompt("Enter value of c:"));
        let discriminant = b*b - 4*a*c;
        if (discriminant > 0) {
            let x1 = (-b + Math.sqrt(discriminant)) / (2*a);
            let x2 = (-b - Math.sqrt(discriminant)) / (2*a);
            console.log("Roots are real: ", x1, x2);
            document.write("Roots are real:"+(x1+x2)+"<br>");
        }
        else if (discriminant === 0) {
            let root = -b / (2*a);
            console.log("Roots are equal: ", root);
            document.write("Root are equal:"+root+"<br>");

        }
        else {
            console.log("Roots are imaginary.");
            document.write("Roots are imaginary.");
        }
        
    </script>
    
</body>
</html>
