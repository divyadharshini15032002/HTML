<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        const numbers = [10, 50, 80, 30];
        const hasAbove100 = numbers.some(function(num) {
            return num > 100;
        });
        document.write(""+hasAbove100+"<br>")

        
    </script>
    
</body>
