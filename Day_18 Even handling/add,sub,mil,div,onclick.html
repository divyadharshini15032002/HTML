<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(x,y){
            let c=x+y;
            document.write("Addition Value is"+c);
        } function sub(x,y){
            let c=x-y;
            document.write("Subtraction value is"+c);
        }function mul(x,y){
            let c=x*y;
            document.write("Multiplication value is"+c);
        } function div(x,y){
            let c=x/y;
            document.write("Division value is"+c);
        }
    </script>
    
    <button onclick="add(2,5)">Add</button>
    <button onclick="sub(4,7)">Sub</button>
    <button onclick="mul(65,4)">Mul</button>
    <button onclick="div(53,7)">Div</button>
    
</body>
</html>
