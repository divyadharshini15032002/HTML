<body>
    <script>
        let currentDate = new Date();
        console.log("Current Date:", currentDate);
        currentDate.setDate(currentDate.getDate() + 10);
        
        console.log("Date after 10 days:", currentDate);
        document.write(""+"Date after 10 days:", currentDate+"<br>")

    </script>
