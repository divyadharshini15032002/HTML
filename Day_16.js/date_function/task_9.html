<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let date1 = new Date("2025-12-01");
        let date2 = new Date("2025-12-15");
        let timeDifference = date2 - date1; 
        let daysDifference = timeDifference / (1000 * 60 * 60 * 24);
        
        console.log(`Number of days between ${date1.toDateString()} and ${date2.toDateString()}: ${daysDifference}`);
        document.write(""+`Number of days between ${date1.toDateString()} and ${date2.toDateString()}: ${daysDifference}`+"<br>");

    </script>
    
</body>
</html>
