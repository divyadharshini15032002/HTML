<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const date1 = new Date("2025-12-01");
        const date2 = new Date("2025-11-25");
        if (date1 < date2) {
            console.log(`${date1.toDateString()} is earlier than ${date2.toDateString()}`);
        } else if (date1 > date2) {
            console.log(`${date2.toDateString()} is earlier than ${date1.toDateString()}`);
        } else {
            console.log("Both dates are the same.");
        }
    </script>
    
</body>
</html>
