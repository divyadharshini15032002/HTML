<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function containsIgnoreCase(str, sub) {
            return str
            .toLocaleLowerCase()
            .normalize("NFD")
            .includes(sub.toLocaleLowerCase().normalize("NFD"));
        }

        console.log(containsIgnoreCase("Café Latte", "CAFE"));
        document.write(""+containsIgnoreCase("Café Latte", "CAFE")+"<br>") 

    </script>
    
</body>
</html>
