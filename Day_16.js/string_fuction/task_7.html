<body>
    <script>
        const str = "ab12cd34";
        const digits = str

        .split("")
        .filter(ch => !isNaN(ch) && ch !== " ")
        .join("");

        console.log(digits);  
        document.write(""+digits+"<br>")
 

    </script>
