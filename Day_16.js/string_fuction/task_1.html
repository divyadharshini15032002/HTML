<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function countVowels(str) {
            const vowels = 'aeiou'; 
            let count = 0;
            str = str.toLowerCase();
            for (let char of str) {
                if (vowels.includes(char)) {
                    count++;
                }
            }
            return count;
        }
        const input = "Hello World";
        console.log(`Number of vowels in "${input}" is:`, countVowels(input));
        document.write(""+`Number of vowels in "${input}" is:`, countVowels(input)+"<br>");
    </script>

    
</body>
</html>
