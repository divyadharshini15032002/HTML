<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function secondIndexOf(str, letter) {
            const first = str.indexOf(letter);
            if (first === -1) return -1; 

            return str.indexOf(letter, first + 1);
        }
        console.log(secondIndexOf("banana", "a"));
        document.write(""+secondIndexOf("banana", "a")+"<br>")

        console.log(secondIndexOf("hello", "l")); 
        document.write(""+secondIndexOf("hello", "1")+"<br>") 
    
        console.log(secondIndexOf("test", "t"));
        document.write(""+secondIndexOf("test", "t")+"<br>")   

        console.log(secondIndexOf("abc", "d"));  
        document.write(""+secondIndexOf("abc", "d")+"<br>")  
    </script>
    
</body>
</html>
