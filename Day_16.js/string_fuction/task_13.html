<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function toTitleCase(str) {
            return str
            .split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
        }
        console.log(toTitleCase("hello world program"));
        document.write(""+toTitleCase("hello world program")+"<br>")

    </script>
    
</body>
</html>
