<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str = "programming";
        let uniqueStr = str
        .split('')                       
        .filter((char, index, arr) => arr.indexOf(char) === index)
        .join('');
        
        console.log(uniqueStr); 
        document.write(""+uniqueStr+"<br>")

    </script>
    
</body>
</html>
