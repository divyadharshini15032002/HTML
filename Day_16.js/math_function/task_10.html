<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function isPerfectSquare(num) {
            if (num < 0) return false; 
            const sqrt = Math.sqrt(num);
            return Number.isInteger(sqrt);
        }
        console.log(isPerfectSquare(25));
        document.write(""+isPerfectSquare(25)+"<br>");

       console.log(isPerfectSquare(15));
       document.write(""+isPerfectSquare(15)+"<br>");

       console.log(isPerfectSquare(54));
       document.write(""+isPerfectSquare(54)+"<br>");

       console.log(isPerfectSquare(-8)); 
       document.write(""+isPerfectSquare(-8)+"<br>");

    </script>
    
</body>
</html>
