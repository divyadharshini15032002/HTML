<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = 5.7;
        let roundedUp = Math.ceil(number);  
        let roundedDown = Math.floor(number); 
        
        console.log("Original number:", number);
        console.log("Rounded up (ceil):", roundedUp);
        console.log("Rounded down (floor):", roundedDown);

        document.write(""+"Original number:", number+"<br>");
        document.write(""+"Rounded up (ceil):", roundedUp+"<br>");
        document.write(""+"Rounded down (floor):", roundedDown+"<br>");

    </script>
    
</body>
</html>
