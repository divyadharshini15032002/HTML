<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str = "javascript is awesome";
        let letter = "v";
        let firstIndex = str.indexOf(letter);
        let secondIndex = str.indexOf(letter, firstIndex + 1);
        
        console.log("The second occurrence of", letter, "is at index:", secondIndex);
        document.write(""+"The second occurrence of", letter, "is at index:", secondIndex+"<br>")


    </script>
    
</body>
</html>
