<!DOCTYPE html>

</head>
<body>
    <script>
        function absoluteDifference(a, b) {
            return Math.abs(a - b);
        }
        console.log(absoluteDifference(10, 4));   
        console.log(absoluteDifference(4, 10));   
        console.log(absoluteDifference(-5, 3)); 
        
        document.write(""+absoluteDifference(45,5)+"<br>");
        document.write(""+absoluteDifference(23,6)+"<br>");
        document.write(""+absoluteDifference(-2,67)+"<br>");

    </script>
    
</body>
</html>
