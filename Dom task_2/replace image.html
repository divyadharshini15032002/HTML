<html lang="en">
<head>

<body>
    
    
    <img src="./birds.jfif" id="image">
    <button onclick="changeimg()">Change Image</button>

    <script>
        function changeimg(){
            let img1=document.getElementById("image");
            let img2=document.createElement("img");
            let img3=document.createElement("img")

            img2.src="./rose.jfif";
            img3. src="./download.jpeg";

            document.body.replaceChild(img3,img1);
            
            
        }
    </script>
    
</body>
