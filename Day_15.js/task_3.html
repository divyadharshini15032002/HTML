    <script>
        function findDivisibleBy9(start, end) {
            let numbers = [];
            let sum = 0;
            for (let i = start; i <= end; i++) {
                if (i % 9 === 0) {
                    numbers.push(i);
                    sum += i;
                }
            }
            return { numbers, sum };
        }
