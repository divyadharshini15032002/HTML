<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function isPalindrome(num) {
            let original = num;
            let reversed = 0;
            let n = Math.abs(num);
            while (n > 0) {
                let digit = n % 10;
                reversed = reversed * 10 + digit;
                n = Math.floor(n / 10);
            }
        }
        return reversed === Math.abs(original);
        let number = parseInt(prompt("Enter a number:"));
        if (isPalindrome(number)) {
            alert(number + " is a Palindrome number");
        } else {
            alert(number + " is NOT a Palindrome number");
            }
    </script>
    
</body>
</html>
