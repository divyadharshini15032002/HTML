<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sumEvenNumbers() {
             let sum = 0;
             for (let i = 100; i <= 150; i++) {
                if (i % 2 === 0) {
                sum += i;
            }
        }
        return sum;
    }
    console.log("Sum of even numbers from 100 to 150 is:", sumEvenNumbers());
    </script>
    
</body>
</html>
