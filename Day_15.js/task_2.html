<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function findNumbers() {
            let result = [];

            for (let i = 1; i <= 100; i++) {
                if (i % 7 === 0 && i % 5 === 0) {
                    result.push(i);
                }
            }
            return result;
        }
        console.log(findNumbers());
        document.write(""+findNumbers()+"<br>")


    </script>
</body>
</html>
