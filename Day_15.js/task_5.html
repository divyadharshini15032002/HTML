<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    function countDivisibleBy9() {
        let count = 0;
        for (let i = 1; i <= 100; i++) {
            if (i % 9 === 0) {
                count++;
            }
        }
        return count;
    }
    console.log("Count of numbers divisible by 9 from 1 to 100 is:", countDivisibleBy9());
    </script>
    
</body>
</html>
