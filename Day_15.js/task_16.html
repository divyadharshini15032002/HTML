<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function productOfDigits(num) {
            let n = Math.abs(num); 
            let product = 1;
            if (n === 0) return 0; 
            while (n > 0) {
                let digit = n % 10;
                product *= digit;
                n = Math.floor(n / 10);
            }
            return product;
        }
        let number = parseInt(prompt("Enter a number:"));
        alert("Product of digits of " + number + " is " + productOfDigits(number));

    </script>
    
</body>
</html>
