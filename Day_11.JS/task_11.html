<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt("Enter a number:"));
        if (num % 4 === 0) {
            console.log("Number is divisible by 4");
            document.write("Number is divisible by 4");

        } else {
            console.log("Not divisible by 4");
            document.write("Not divisible by 4");
        }
    </script>
    
</body>
</html>
