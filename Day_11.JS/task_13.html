<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt("Enter a number:"));
        if (num % 7 === 0 && num % 10 === 0) {
            console.log("Buzz number");
            document.write("Buzz number");

        } else {
            console.log("Not a Buzz number");
            document.write(" Not Buzz number");
        }
    </script>
    
</body>
</html>
