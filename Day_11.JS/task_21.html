<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = prompt("Enter employee name:");
        let salary = parseFloat(prompt("Enter employee salary:"));
        let years = parseInt(prompt("Enter years of service:"));
        let bonus = 0;
        if (years >= 5) {
            bonus = salary * 0.20;   
             } else {
                bonus = salary * 0.10;   
                }
                let totalSalary = salary + bonus;
                alert("Diwali Bonus Details\n" +
                "-------------------------\n" +
                "Employee Name: " + name + "\n" +
                "Salary: Rs " + salary + "\n" +
                "Bonus: Rs " + bonus.toFixed(2) + "\n" +
                "Total Salary after Bonus: Rs " + totalSalary.toFixed(2));
    </script>
</body>
</html>
