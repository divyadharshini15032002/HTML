<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = Number(prompt("Enter side a:"));
        let b = Number(prompt("Enter side b:"));
        let c = Number(prompt("Enter side c:"));
        if (a === b && b === c) {
            console.log("Equilateral Triangle");
            document.write("Equilateral Triangle is: "+equilateralTriangle+"<br>");
        } 
        else if (a === b || b === c || a === c) {
            console.log("Isosceles Triangle");
            document.write("Isosceles Triangle is:"+isoscelesTriangle+"<br>");
        } 
        else {
            console.log("Scalene Triangle");
            document.write("Scalene Triangle is:"+scaleneTriangle+"<br>");
        }
    </script>
    
</body>
</html>
