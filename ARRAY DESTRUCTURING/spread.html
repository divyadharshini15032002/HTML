<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const arr1 = [1, 2, 3];
        const arr2 = [4, 5, 6];
        const combined = [...arr1, ...arr2];
        const [a, b, c, ...rest] = combined;
        document.write(""+a+"<br>");
        document.write(""+b+"<br>");
        document.write(""+c+"<br>");
        document.write(""+rest+"<br>");
      

    </script>
    
</body>
</html>
