    <title>Document</title>
</head>
<body>
    <script>
        const sentence = "JavaScript destructuring makes code cleaner";
        const words = sentence.split(" ");
        const [first, ...middleAndLast] = words;
        const [...  last] = middleAndLast;

        document.write(""+first+"<br>");
        document.write(""+middle+"<br>");
        document.write(""+last+"<br>");

   </script>
    
</body>
