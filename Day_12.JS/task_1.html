<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let A =Number(prompt("Enter value of A:"));
        let B=Number(prompt("Enter value for B:"));
        let C=prompt("Enter operation(add,sub,mul,div):");

        switch(C.toLowerCase()) {
            case "add":
            console.log("A+B="+(A+B));
            document.write("add value is:"+add+"<br>");
            break;

            case "sub":
            console.log("A-B="+(A-B));
            document.write("sub value is:"+sub+"<br>");
            break;

            case "mul":
            console.log("A*B="+(A*B));
            break;

            case "div":
            if(B!==0){
                console.log("A/B="+(A/B));
            }else{
                console.log("cannot divide by zero!");
            }
            break;
            default:
                console.log("Invalid option!choose add,sub,mul,or div.");

            
        }
    </script>

    
</body>
</html>
