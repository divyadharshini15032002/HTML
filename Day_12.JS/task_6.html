<!DOCTYPE html>
<html lang="en">

<body>
    <script>
    function checkEligibility(aptitude, gd, technical, hr) {
    if (aptitude >= 85 && gd >= 90 && technical >= 80 && hr >= 95) {
        return "Candidate is Eligible for the Job.";
    } else {
        return "Candidate is NOT Eligible for the Job.";
    }
}
let aptitude = parseInt(prompt("Enter Aptitude Marks:"));
let gd = parseInt(prompt("Enter GD Marks:"));
let technical = parseInt(prompt("Enter Technical Marks:"));
let hr = parseInt(prompt("Enter HR Marks:"));
let result = checkEligibility(aptitude, gd, technical, hr);
console.log(result);
</script> 
</body>
</html>
