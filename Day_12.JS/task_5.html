<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getSubjects(year, semester) {
    const subjects = {
        1: {
            1: ["Mathematics I", "Physics", "Programming Basics", "English", "Environmental Science"],
            2: ["Mathematics II", "Chemistry", "Data Structures", "Computer Fundamentals", "Communication Skills"]
        },
        2: {
            1: ["Discrete Mathematics", "OOP with Java", "Digital Electronics", "DBMS", "Operating Systems"],
            2: ["Computer Networks", "Microprocessors", "Software Engineering", "Web Technology", "Probability & Statistics"]
        },
        3: {
            1: ["Algorithms", "Advanced Java", "Cloud Computing", "Compiler Design", "Machine Learning"],
            2: ["IoT", "Big Data Analytics", "Cyber Security", "Mobile Computing", "Artificial Intelligence"]
        },
        4: {
            1: ["Deep Learning", "Blockchain Technology", "Distributed Systems", "Data Mining", "Image Processing"],
            2: ["Project Work", "Seminar", "Internship", "Research Methodology", "Professional Ethics"]
        }
    };

    return subjects[year]?.[semester] || null;
}


const year = parseInt(prompt("Enter your year (1-4):"));
const semester = parseInt(prompt("Enter your semester (1 or 2):"));


const result = getSubjects(year, semester);

if (result) {
    console.log(`Subjects for Year ${year}, Semester ${semester}:`);
    result.forEach((sub, index) => console.log(`${index + 1}. ${sub}`));
} else {
    console.log("Invalid year or semester. Please try again!");
}

    </script>
    
</body>
</html>
